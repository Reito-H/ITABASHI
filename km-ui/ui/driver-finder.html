<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>乗務員検索 デモ</title>
<style>body{margin:0;font:14px/1.6 "Noto Sans JP",system-ui,sans-serif;background:#f3f5f8;color:#1b2430}main{max-width:720px;margin:40px auto;padding:0 16px}.card{background:#fff;border:1px solid #d5dbe3;border-radius:10px;padding:18px 20px;margin-bottom:14px}code{font-family:ui-monospace,Menlo,Consolas,monospace;background:#e9edf2;padding:1px 5px;border-radius:4px}</style></head>
<body><main>
<div class="card"><h2 style="margin:0 0 6px">乗務員クイック検索(右下)のデモ</h2><p>このページはホシコンの任意の画面の代わりです。右下の「乗務員検索」を押すか <code>Ctrl+/</code> で開き、名前を入力してください。ここでは架空データで動いています。</p>
<p>組み込みは 1 行です: <code>&lt;script src="driver-finder.js"&gt;&lt;/script&gt;</code>。同一オリジンに <code>/kmx/api/v1</code>(Worker のプロキシ)があれば実データで動きます。</p></div>
<div class="card"><h3 style="margin:0 0 6px">表示する内容</h3><ul><li>無線番号(大きく)と乗務員名、現在の状態(空車・実車・迎車…)</li><li>車両番号(取得できる場合)と「無線番号をコピー」</li><li>現在地の住所(緯度経度から住所変換)</li></ul></div>
</main>
<script>window.DRIVER_FINDER={mock:true};</script>
<script src="driver-finder.js"></script>
</body></html>
